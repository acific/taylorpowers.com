<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Baskervville:ital@0;1&display=block" rel="stylesheet">
<style>
@font-face{font-family:Switzer;font-weight:400;src:url(../../assets/home/fonts/switzer-400.woff2)}
@font-face{font-family:Switzer;font-weight:500;src:url(../../assets/home/fonts/switzer-500.woff2)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:#0d0f0c}
.card{position:relative;width:1200px;height:630px;display:flex;color:#fff;
 background:radial-gradient(120% 140% at 85% 30%,#3d443a 0%,#20251f 45%,#0d0f0c 100%)}
.photo{position:absolute;right:0;top:0;width:640px;height:630px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 38%);mask-image:linear-gradient(90deg,transparent 0,#000 38%)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:60% 18%}
.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.3),rgba(0,0,0,0) 30%)}
.copy{position:relative;z-index:2;padding:64px 0 56px 72px;width:700px;display:flex;flex-direction:column}
.kicker{font:500 15px/1 Switzer;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.6)}
h1{margin-top:auto;font:400 104px/.92 Baskervville,serif;letter-spacing:-.02em}
h1 span{color:#d9ff3c}
.role{margin-top:26px;font:400 26px/1.25 Switzer;letter-spacing:-.02em;color:rgba(255,255,255,.88)}
.rule{margin-top:34px;height:1px;width:480px;background:rgba(255,255,255,.22)}
.brands{margin-top:18px;font:400 17px/1 Switzer;letter-spacing:.02em;color:rgba(255,255,255,.62)}
.url{margin-top:16px;font:500 17px/1 Switzer;color:#fff}
</style></head><body><div class="card">
<div class="photo"><img src="../../assets/about/taylor-headshot-2026.jpg"></div>
<div class="copy">
 <p class="kicker">Portfolio</p>
 <h1>Taylor<br>Powers<span>.</span></h1>
 <p class="role">Brand &amp; Marketing Executive</p>
 <div class="rule"></div>
 <p class="brands">SuperFile · Trackhouse · UFC · LAFC · EGO · FLEX</p>
 <p class="url">taylorpowers.com</p>
</div></div></body></html>
